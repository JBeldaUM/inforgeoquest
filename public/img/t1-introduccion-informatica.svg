<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" width="640" height="280" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4e0816"/>
      <stop offset="55%" stop-color="#8b152a"/>
      <stop offset="100%" stop-color="#b8233e"/>
    </linearGradient>
    <radialGradient id="glow1" cx="52%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#ff6b8a" stop-opacity="0.38"/>
      <stop offset="100%" stop-color="#4e0816" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chip1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9db0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffd1dc" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="vignette1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a0207" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#1a0207" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1a0207" stop-opacity="0.45"/>
    </linearGradient>
  </defs>

  <rect width="640" height="280" fill="url(#bg1)"/>
  <rect width="640" height="280" fill="url(#glow1)"/>

  <!-- Subtle digital grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <path d="M0 40H640 M0 80H640 M0 120H640 M0 160H640 M0 200H640 M0 240H640"/>
    <path d="M80 0V280 M160 0V280 M240 0V280 M320 0V280 M400 0V280 M480 0V280 M560 0V280"/>
  </g>

  <!-- Subtle binary columns -->
  <g fill="#ffd6df" fill-opacity="0.14" font-family="monospace" font-weight="700" font-size="14">
    <text x="36" y="72">01001010</text>
    <text x="36" y="96">11010011</text>
    <text x="36" y="196">10110100</text>
    <text x="36" y="220">00101110</text>
    <text x="510" y="78">10101101</text>
    <text x="510" y="102">01100110</text>
    <text x="510" y="198">11001010</text>
    <text x="510" y="222">01011001</text>
  </g>

  <!-- Circuit traces radiating from microchip -->
  <g fill="none" stroke="#ff9cb0" stroke-opacity="0.48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M250 115 H190 L165 90 H110"/>
    <path d="M250 140 H145 L125 160 H70"/>
    <path d="M250 165 H200 L175 190 H125"/>
    <path d="M390 115 H450 L475 90 H530"/>
    <path d="M390 140 H495 L515 160 H575"/>
    <path d="M390 165 H440 L465 190 H520"/>
    <path d="M295 76 V42 L275 24"/>
    <path d="M345 76 V42 L365 24"/>
    <path d="M295 204 V238 L275 256"/>
    <path d="M345 204 V238 L365 256"/>
  </g>

  <!-- Circuit terminal nodes -->
  <g fill="#ffd4de" fill-opacity="0.78">
    <circle cx="110" cy="90" r="4.5"/>
    <circle cx="70" cy="160" r="4.5"/>
    <circle cx="125" cy="190" r="4.5"/>
    <circle cx="530" cy="90" r="4.5"/>
    <circle cx="575" cy="160" r="4.5"/>
    <circle cx="520" cy="190" r="4.5"/>
  </g>

  <!-- Digital pulse wave -->
  <path d="M40 242 H150 L166 218 L182 252 L198 228 L214 242 H426 L442 220 L458 254 L474 230 L490 242 H600"
        fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Central Microchip -->
  <g transform="translate(256, 76)">
    <!-- Pins -->
    <g stroke="#ffd1dc" stroke-width="4" stroke-linecap="round" stroke-opacity="0.75">
      <line x1="22" y1="-10" x2="22" y2="2"/><line x1="46" y1="-10" x2="46" y2="2"/>
      <line x1="82" y1="-10" x2="82" y2="2"/><line x1="106" y1="-10" x2="106" y2="2"/>
      <line x1="22" y1="126" x2="22" y2="138"/><line x1="46" y1="126" x2="46" y2="138"/>
      <line x1="82" y1="126" x2="82" y2="138"/><line x1="106" y1="126" x2="106" y2="138"/>
      <line x1="-10" y1="26" x2="2" y2="26"/><line x1="-10" y1="52" x2="2" y2="52"/>
      <line x1="-10" y1="76" x2="2" y2="76"/><line x1="-10" y1="102" x2="2" y2="102"/>
      <line x1="126" y1="26" x2="138" y2="26"/><line x1="126" y1="52" x2="138" y2="52"/>
      <line x1="126" y1="76" x2="138" y2="76"/><line x1="126" y1="102" x2="138" y2="102"/>
    </g>
    <!-- Chip body -->
    <rect x="0" y="0" width="128" height="128" rx="18" fill="#3a0511" fill-opacity="0.65" stroke="url(#chip1)" stroke-width="3"/>
    <rect x="18" y="18" width="92" height="92" rx="10" fill="#ffffff" fill-opacity="0.1" stroke="#ffb3c4" stroke-opacity="0.55" stroke-width="1.8"/>
    <!-- Inner core symbol -->
    <circle cx="64" cy="64" r="22" fill="#ff7d99" fill-opacity="0.25" stroke="#ffffff" stroke-opacity="0.8" stroke-width="2.5"/>
    <circle cx="64" cy="64" r="8" fill="#ffffff" fill-opacity="0.9"/>
  </g>

  <rect width="640" height="280" fill="url(#vignette1)"/>
</svg>
